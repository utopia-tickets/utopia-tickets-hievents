# Idioma por defecto del HTML que pinta el servidor (incluido en http {} por el paso 10 de patch.mjs,
# solo si este fichero existe y nginx -t pasa con él).
# El SSR de Hi.Events (getLocale, src/entry.server.tsx) mira primero el «Locale» del widget y del pago, después la
# cookie «locale» y después Accept-Language; sin nada, sale en inglés. Los rastreadores (Googlebot, Bing, las vistas
# previas de los enlaces) no mandan Accept-Language, así que veían el organizador, el evento y la 404 en inglés.
# Este map manda «es» cuando la petición no trae idioma o solo trae «*»; si trae uno, pasa tal cual, así que un
# navegador en inglés sigue en inglés. El «Locale» del widget y la cookie siguen mandando, porque van antes.
map $http_accept_language $utopia_accept_language {
    default                 $http_accept_language;
    ""                      "es";
    "~^\s*\*\s*(;|,|$)"     "es";
}
