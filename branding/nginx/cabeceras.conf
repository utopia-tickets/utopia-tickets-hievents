# Cabeceras de seguridad de Utopia Tickets (incluido desde nginx.conf por el paso 10 de patch.mjs).
# nginx no hereda add_header en los location que tienen el suyo: por eso se incluye en cada uno.
# HSTS no va aquí: lo pone el proxy TLS público.
# Fuera X-XSS-Protection (obsoleta; los navegadores actuales la ignoran y el paso 10 ya quita la de la imagen).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), usb=(), interest-cohort=()" always;
