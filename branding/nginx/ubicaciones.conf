# Ubicaciones extra del frontend (incluido dentro de server {} por el paso 10 de patch.mjs).
# 1) /assets/: los ficheros llevan huella en el nombre y los que cambia la marca van con ?v=<huella> (paso 9),
#    así que se pueden guardar un año sin riesgo de servir uno viejo.
location ^~ /assets/ {
    proxy_pass http://localhost:5678;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Powered-By;
    include /branding/nginx/cabeceras.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}
# 2) /utopia/: logos, CSS y páginas propias; una hora.
location ^~ /utopia/ {
    # Las carpetas (/utopia/ayuda/, /utopia/promotores/, /utopia/legal/) sirven su index.html.
    rewrite ^(/utopia/.*)/$ $1/index.html break;
    rewrite ^/utopia/(ayuda|promotores|legal)$ /utopia/$1/index.html break;
    proxy_pass http://localhost:5678;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Powered-By;
    include /branding/nginx/cabeceras.conf;
    include /branding/nginx/estaticas.conf;
    add_header Cache-Control "public, max-age=3600" always;
    # Lo que no existe bajo /utopia/ sale con la 404 de la marca (en español y noindex), con estado 404.
    proxy_intercept_errors on;
    error_page 404 @utopia404;
}
# 3) Panel y acceso: no se pueden meter en un marco de otra web (clickjacking). La página del evento, el pago y el
#    widget sí, porque el widget de Hi.Events los abre dentro de un iframe en la web del promotor.
location ~ ^/(manage|admin|auth|account|accounts|welcome)(/|$) {
    proxy_pass http://localhost:5678;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-Frame-Options;
    include /branding/nginx/cabeceras.conf;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "no-store" always;
}
# 4) Portada pública: «/» (solo la raíz exacta, con o sin ?parámetros) sirve /utopia/inicio/index.html
#    sin redirigir. El resto de rutas (/auth/login, /manage/*, /event/*, /widget/*, /api/*) no cambia. Si una versión
#    nueva de la imagen cambia nginx.conf, el paso 10 de patch.mjs no incluye este fichero y «/» vuelve a ser la SPA.
location = / {
    rewrite ^ /utopia/inicio/index.html break;
    proxy_pass http://localhost:5678;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Powered-By;
    include /branding/nginx/cabeceras.conf;
    # «/» fuera de marcos ajenos. Solo frame-ancestors: la CSP completa de /utopia/ no se aplica aquí para
    # no depender de dónde vienen las imágenes de los eventos que pinta inicio.js.
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Cache-Control "public, max-age=300" always;
}
# 5) SEO, security.txt y 404 de las páginas propias.
#    robots.txt: la imagen ya tiene «location = /robots.txt» (el de Laravel, sin Sitemap) y no se puede repetir; esta
#    reescritura de nivel server va antes de elegir location y lo manda a /utopia/robots.txt (paginas/gen_paginas.py),
#    que declara los dos sitemaps: el de Hi.Events (/sitemap.xml) y el de las páginas propias (/utopia/sitemap.xml).
rewrite ^/robots\.txt$ /utopia/robots.txt last;
#    security.txt (RFC 9116), servido desde public/security.txt; Expires < 1 año (lo vigila test/seguridad.test.mjs).
location = /.well-known/security.txt {
    rewrite ^ /utopia/security.txt break;
    proxy_pass http://localhost:5678;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Content-Type;
    include /branding/nginx/cabeceras.conf;
    include /branding/nginx/estaticas.conf;
    add_header Content-Type "text/plain; charset=utf-8" always;
    add_header Cache-Control "public, max-age=86400" always;
}
#    Copias exactas de los legales aceptados (legal/versiones/): no se tocan (su huella está registrada), así que el
#    noindex va por cabecera.
location ^~ /utopia/legal/versiones/ {
    proxy_pass http://localhost:5678;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Powered-By;
    include /branding/nginx/cabeceras.conf;
    include /branding/nginx/estaticas.conf;
    add_header X-Robots-Tag "noindex" always;
    add_header Cache-Control "public, max-age=3600" always;
    proxy_intercept_errors on;
    error_page 404 @utopia404;
}
#    La 404 de la marca (public/404.html). Conserva el estado 404 de la petición original y no se guarda en caché.
location @utopia404 {
    rewrite ^ /utopia/404.html break;
    proxy_pass http://localhost:5678;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Powered-By;
    include /branding/nginx/cabeceras.conf;
    include /branding/nginx/estaticas.conf;
    add_header X-Robots-Tag "noindex" always;
    add_header Cache-Control "no-store" always;
}
