# Páginas estáticas propias (/utopia/*, security.txt, robots.txt): CSP estricta y fuera de marcos ajenos.
# Ninguna lleva <script> ni estilos en línea. El único script es el de Cloudflare que descifra los mailto
# (/cdn-cgi/scripts/…/email-decode.min.js, del mismo origen). El nonce por petición ($request_id) no lo usa ninguna
# página: está para el script en línea que Cloudflare inyecta (JavaScript Detections), que lee el nonce de esta
# cabecera y lo copia a su <script>. Sin nonce, ese script se bloquea (solo un aviso en la consola).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
